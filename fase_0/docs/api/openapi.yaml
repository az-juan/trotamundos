openapi: 3.1.0
info:
  title: Trotamundos API (Pater - Gateway + BFFs)
  version: 0.1.0
  description: >
    Contrato de referencia DIFERIDO a Fase 1 (ADR-111). En el prototipo Fase 0 NO se expone
    API JSON: los handlers de Pater consultan PostgreSQL con sqlc y renderizan HTML/HTMX,
    con sesion en cookie firmada. Mobile BFF, JWT RS256 y JWKS se reintroducen en Fase 1.
  contact: { name: Trotamundos Architecture, url: "https://github.com/az-juan/trotamundos" }

servers:
  - url: https://api.trotamundos.app
    description: Produccion (Fase 0)
  - url: http://localhost:8080
    description: Desarrollo local

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: trips
  - name: bookings
  - name: mailboxes
  - name: webhooks
  - name: sharing
  - name: insights
  - name: assistant
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/login:
    post:
      tags: [auth]
      summary: Autenticacion (Fase 0 - Pater verifica contra Filius y emite JWT RS256, ADR-106)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: JWT RS256 emitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renovar access token usando refresh_token opaco en Redis (TTL 7d)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: Nuevo JWT RS256 emitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revocar refresh_token en Redis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "204":
          description: Sesion revocada

  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: JWKS publico para validacion del JWT RS256
      security: []
      responses:
        "200":
          description: JWKS
          content:
            application/json:
              schema: { type: object }

  /users/me/preferences:
    get:
      tags: [users]
      summary: Obtener preferencias del viajero autenticado (ADR-106, QA-13)
      responses:
        "200":
          description: Preferencias del usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
    patch:
      tags: [users]
      summary: Actualizar preferencias del viajero (locale, moneda, radio GPS, preferencias de viaje)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferences" }
      responses:
        "200":
          description: Preferencias actualizadas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }

  /trips:
    get:
      tags: [trips]
      summary: Listar viajes del usuario autenticado
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [upcoming, active, archived] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripList" }
    post:
      tags: [trips]
      summary: Crear un viaje (agrupacion de reservas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTripRequest" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /trips/{tripId}:
    parameters:
      - { in: path, name: tripId, required: true, schema: { type: string } }
    get:
      tags: [trips]
      summary: Detalle de un viaje con sus reservas
      responses:
        "200":
          description: Viaje + reservas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [trips]
      summary: Actualizar metadatos del viaje
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTripRequest" }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trip" }

  /trips/{tripId}/share:
    parameters:
      - { in: path, name: tripId, required: true, schema: { type: string } }
    post:
      tags: [sharing]
      summary: Generar enlace compartible con permisos de visualizacion (QA-10, FR-8)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequest" }
      responses:
        "201":
          description: Token de comparticion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareToken" }
    get:
      tags: [sharing]
      summary: Ver itinerario compartido (publico con token)
      security: []
      parameters:
        - { in: query, name: token, required: true, schema: { type: string } }
      responses:
        "200":
          description: Itinerario de solo lectura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripDetail" }

  /bookings:
    get:
      tags: [bookings]
      summary: Listar reservas (hospedaje y transporte)
      parameters:
        - { in: query, name: trip_id, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [lodging, transport, car_rental] } }
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingList" }
    post:
      tags: [bookings]
      summary: Crear reserva manual (FR-4)
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "409": { $ref: "#/components/responses/Conflict" }

  /bookings/{bookingId}:
    parameters:
      - { in: path, name: bookingId, required: true, schema: { type: string } }
    get:
      tags: [bookings]
      summary: Detalle de una reserva
      responses:
        "200":
          description: Reserva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/NotFound" }

  /trips/nearby:
    get:
      tags: [trips]
      summary: Viajes/reservas cercanos al viajero (GPS, QA-13)
      parameters:
        - { in: query, name: lat, required: true, schema: { type: number } }
        - { in: query, name: lon, required: true, schema: { type: number } }
        - { in: query, name: radius_km, schema: { type: number, default: 50 } }
      responses:
        "200":
          description: Lista de viajes cercanos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripList" }

  /insights:
    get:
      tags: [insights]
      summary: Read-model analitico servido por Spiritus (sin tocar OLTP, QA-15)
      parameters:
        - { in: query, name: range, schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
      responses:
        "200":
          description: Insights agregados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Insights" }

  /insights/stream:
    get:
      tags: [insights]
      summary: SSE de notificaciones en vivo (disrupciones, trip.disrupted)
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }

  /mailboxes:
    get:
      tags: [mailboxes]
      summary: Listar buzones de correo vinculados por el usuario (FR-2, QA-9)
      responses:
        "200":
          description: Lista de buzones vinculados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mailbox" }
    post:
      tags: [mailboxes]
      summary: Vincular un nuevo buzon Gmail (OAuth2) o IMAP para captura automatica (FR-2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectMailboxRequest" }
      responses:
        "201":
          description: Buzon vinculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mailbox" }

  /whitelists:
    get:
      tags: [mailboxes]
      summary: Listar remitentes seguros en la whitelist del usuario (FR-3)
      responses:
        "200":
          description: Lista de remitentes autorizados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WhitelistSender" }
    post:
      tags: [mailboxes]
      summary: Agregar remitente seguro a la whitelist (FR-3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWhitelistRequest" }
      responses:
        "201":
          description: Remitente agregado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhitelistSender" }

  /whitelists/{whitelistId}:
    parameters:
      - { in: path, name: whitelistId, required: true, schema: { type: string } }
    delete:
      tags: [mailboxes]
      summary: Eliminar remitente de la whitelist (FR-3)
      responses:
        "204":
          description: Eliminado

  /webhooks/{provider}:
    parameters:
      - { in: path, name: provider, required: true, schema: { type: string } }
      - { in: header, name: X-Signature, required: true, schema: { type: string, description: "Firma HMAC-SHA256 del payload" } }
      - { in: header, name: Idempotency-Key, required: false, schema: { type: string } }
    post:
      tags: [webhooks]
      summary: Recepcion de webhooks firmados de proveedores externos (aerolineas, hoteles, rentadoras)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook verificado y aceptado para procesamiento
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------------------
  # Asistente Virtual (Fase 1, ADR-109/110) - No expuesto en Fase 0
  # ---------------------------------------------------------------------------
  /assistant/messages:
    post:
      tags: [assistant]
      summary: Enviar un mensaje al Asistente Virtual (primer nivel de soporte, FR-10)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantMessageRequest" }
      responses:
        "200":
          description: Respuesta del asistente (intencion + respuesta + acciones sugeridas)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantMessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Conflict" }

  /assistant/stream:
    get:
      tags: [assistant]
      summary: SSE de respuesta conversacional en streaming (QA-16; misma infraestructura que /insights/stream)
      parameters:
        - { in: query, name: session_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: text/event-stream (delta de tokens + evento final)
          content:
            text/event-stream:
              schema: { type: string }

  /assistant/cases/{caseId}:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string } }
    get:
      tags: [assistant]
      summary: Consultar estado de un caso derivado a la agencia (FR-11, ADR-110)
      responses:
        "200":
          description: Estado del caso (open/handed_off/resolved/closed/expired)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceCase" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/assistance/cases:
    post:
      tags: [assistant]
      summary: "Contrato INTERNO Pater→Filius: abrir caso de asistencia (no expuesto en el borde, ADR-110)"
      parameters:
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
        - { in: header, name: X-Correlation-ID, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenAssistanceCaseRequest" }
      responses:
        "201":
          description: Caso abierto + enlace de derivación con context_token de un solo uso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceHandoff" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/assistance/cases/{caseId}:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string } }
    get:
      tags: [assistant]
      summary: "Contrato INTERNO Pater→Filius: consultar caso (no expuesto en el borde)"
      responses:
        "200":
          description: Estado del caso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistanceCase" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "JWT (RS256)"

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No autenticado / token invalido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto (idempotencia / estado)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        unit: { type: string }
        version: { type: string }

    Error:
      type: object
      required: [code, message, correlation_id]
      properties:
        code: { type: string, example: BOOKING_NOT_FOUND }
        message: { type: string }
        correlation_id: { type: string }
        details: { type: object, additionalProperties: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer }
        refresh_token: { type: string }

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    UserPreferences:
      type: object
      properties:
        locale: { type: string, default: "es" }
        currency: { type: string, default: "USD" }
        gps_radius_km: { type: number, default: 50 }
        preferred_agency_id: { type: string, nullable: true, description: "Agencia preferida para derivaciones del Asistente Virtual (ADR-110)" }
        travel_preferences:
          type: object
          additionalProperties: true
          description: "Preferencias de alojamiento, transporte y rutas del viajero (ADR-106)"

    Mailbox:
      type: object
      required: [id, provider, email, created_at]
      properties:
        id: { type: string }
        provider: { type: string, enum: [gmail, imap] }
        email: { type: string, format: email }
        last_scan_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ConnectMailboxRequest:
      type: object
      required: [provider, email]
      properties:
        provider: { type: string, enum: [gmail, imap] }
        email: { type: string, format: email }
        oauth_code: { type: string }
        imap_host: { type: string }
        imap_secret: { type: string }

    WhitelistSender:
      type: object
      required: [id, sender, created_at]
      properties:
        id: { type: string }
        sender: { type: string }
        created_at: { type: string, format: date-time }

    CreateWhitelistRequest:
      type: object
      required: [sender]
      properties:
        sender: { type: string, description: "Email o dominio autorizado (ej. @aerolinea.com)" }

    Trip:
      type: object
      required: [id, name, status, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [upcoming, active, archived] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        created_at: { type: string, format: date-time }

    TripList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Trip" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }

    CreateTripRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    UpdateTripRequest:
      type: object
      properties:
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    Booking:
      type: object
      required: [id, trip_id, type, status, provider, provider_ref, created_at]
      properties:
        id: { type: string }
        trip_id: { type: string }
        type: { type: string, enum: [lodging, transport, car_rental] }
        status: { type: string, enum: [discovered, pending, confirmed, cancelled, disrupted, archived] }
        provider: { type: string }
        provider_ref: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BookingList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        total: { type: integer }

    CreateBookingRequest:
      type: object
      required: [trip_id, type, provider, provider_ref]
      properties:
        trip_id: { type: string }
        type: { type: string, enum: [lodging, transport, car_rental] }
        provider: { type: string }
        provider_ref: { type: string }
        details: { type: object, additionalProperties: true }

    TripDetail:
      type: object
      properties:
        trip: { $ref: "#/components/schemas/Trip" }
        bookings: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        travelers: { type: array, items: { $ref: "#/components/schemas/Traveler" } }
        share_token: { type: string, nullable: true }

    Traveler:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        document: { type: string }
        email: { type: string, format: email }

    ShareRequest:
      type: object
      properties:
        permission: { type: string, enum: [view], default: view }
        expires_at: { type: string, format: date-time }

    ShareToken:
      type: object
      required: [token, url, expires_at]
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }

    Insights:
      type: object
      properties:
        range: { type: string }
        trips_total: { type: integer }
        bookings_by_type: { type: object, additionalProperties: { type: integer } }
        top_destinations:
          type: array
          items:
            type: object
            properties:
              destination: { type: string }
              count: { type: integer }
        cancellation_rate: { type: number }
        generated_at: { type: string, format: date-time }
    AssistantMessageRequest:
      type: object
      required: [message]
      properties:
        session_id: { type: string, description: "Sesion efimera en Redis (TTL 30 min)" }
        message: { type: string, maxLength: 2000 }
        trip_id: { type: string }
        booking_id: { type: string }
        consent_share_context: { type: boolean, default: false, description: "Consentimiento para enviar contexto redactado al LLM (QA-9)" }

    AssistantMessageResponse:
      type: object
      required: [intent, answer, tier1_resolved, correlation_id]
      properties:
        intent: { $ref: "#/components/schemas/AssistantIntent" }
        answer: { type: string }
        tier1_resolved: { type: boolean, description: "true si no se derivo a la agencia" }
        actions:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [deep_link, open_case, view_trip] }
              url: { type: string, format: uri }
              label: { type: string }
        case_id: { type: string, nullable: true }
        degraded: { type: boolean, description: "true si respondio el clasificador determinista (ASSISTANT_DEGRADED)" }
        correlation_id: { type: string }

    AssistantIntent:
      type: string
      enum: [status_query, reschedule_guidance, minor_issue, complex_handoff, out_of_scope]

    OpenAssistanceCaseRequest:
      type: object
      required: [user_id, reason, severity]
      properties:
        user_id: { type: string, format: uuid }
        trip_id: { type: string }
        booking_id: { type: string }
        reason: { type: string, enum: [complex_request, reschedule_failed, complaint, other] }
        severity: { type: string, enum: [low, medium, high] }

    AssistanceCase:
      type: object
      required: [id, user_id, status, reason, severity, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        trip_id: { type: string, nullable: true }
        booking_id: { type: string, nullable: true }
        status: { type: string, enum: [open, handed_off, resolved, closed, expired] }
        reason: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        agency_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }

    AssistanceHandoff:
      type: object
      required: [case, deep_link_url, context_token_expires_at]
      properties:
        case: { $ref: "#/components/schemas/AssistanceCase" }
        deep_link_url: { type: string, format: uri, description: "Deep-link a la agencia preferida (FR-6)" }
        context_token: { type: string, description: "Opaco, un solo uso, TTL 15 min en Redis" }
        context_token_expires_at: { type: string, format: date-time }
