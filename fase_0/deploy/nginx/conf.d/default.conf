# =============================================================================
# Trotamundos — Nginx Reverse Proxy (Fase 0 · Único borde expuesto -> Pater)
# Deriva de: ADR-103 (SSE / timeouts) y ADR-105 (despliegue en Droplet 1)
# =============================================================================

upstream pater_backend {
    server pater:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Cabeceras estándar de proxy y trazabilidad
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Endpoint SSE (Server-Sent Events) para notificaciones en vivo (ADR-103)
    location /insights/stream {
        proxy_pass http://pater_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # SSE del Asistente Virtual (Fase 1, ADR-109): misma infraestructura sin buffering
    location /assistant/stream {
        proxy_pass http://pater_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Recepción de webhooks de proveedores externos (preservar body para HMAC-SHA256)
    location /webhooks/ {
        proxy_pass http://pater_backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        client_max_body_size 2m;
        proxy_read_timeout 10s;
    }

    # Tráfico general REST, Web BFF y Mobile BFF (SLA <= 800 ms, QA-6)
    location / {
        proxy_pass http://pater_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
