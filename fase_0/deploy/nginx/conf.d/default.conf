# =============================================================================
# Trotamundos — Nginx Reverse Proxy (Fase 0 · Único borde expuesto -> Pater)
# Deriva de: ADR-103 (SSE / timeouts) y ADR-105 (despliegue en Droplet 1)
# =============================================================================

upstream pater_backend {
    server pater:8080;
    keepalive 32;
}

upstream filius_backend {
    server filius:8081;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Cabeceras estándar de proxy y trazabilidad
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (/insights/stream, /assistant/stream) se reintroducen en Fase 1 (ADR-103/109).

    # Recepción de webhooks de proveedores externos (Filius valida HMAC-SHA256, ADR-007)
    location /webhooks/ {
        proxy_pass http://filius_backend;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        client_max_body_size 2m;
        proxy_read_timeout 10s;
    }

    # Tráfico general REST, Web BFF y Mobile BFF (SLA <= 800 ms, QA-6)
    location / {
        proxy_pass http://pater_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
